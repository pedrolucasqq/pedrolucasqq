<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo/estilo.css">
  <title>Contato - OneBite Code</title>
</head>
<body>

  <header>
    <h1>OneBite - Info</h1>
    <p>Mestres em tecnologia e manutenção de computadores</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#servicos">Serviços</a></li>
      <li><a href="index.html#funcionamento">Funcionamento</a></li>
      <li><a href="clientes.html">Clientes</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>

  <main>

    <section id="clientes">
      <h2>Entre em Contato</h2>

      <form action="#" method="post">

        <p>
          <label for="nome">Nome:</label><br>
          <input type="text" id="nome" name="nome" required>
        </p>

        <br>

        <p>
          <label for="email">E-mail:</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <br>

        <p>
          <label for="telefone">Telefone:</label><br>
          <input type="tel" id="telefone" name="telefone" required>
        </p>

        <br>

        <p>
          <label for="assunto">Assunto:</label><br>
          <input type="text" id="assunto" name="assunto" required>
        </p>

        <br>

        <p>
          <label for="mensagem">Mensagem:</label><br>
          <textarea id="mensagem" name="mensagem" rows="5" cols="50" required></textarea>
        </p>

        <br>

        <button type="submit">Enviar</button>

      </form>
    </section>

  </main>

  <footer>
    <p>
      OneBite Code - Sua empresa de tecnologia <br>
      Palmas - TO
    </p>
  </footer>

</body>
</html>
