<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="../../index.html" class="back-link">
            ← Portfólio
        </a>

        <p class="project-label">
            PERSONAL PROJECT / 01
        </p>

    </header>


    <main>

        <section class="hero">

            <p class="eyebrow">
                COLOR EXPLORATION
            </p>

            <h1>
                COLOR<br>
                LAB
            </h1>

            <p class="description">
                Uma pequena ferramenta para explorar,
                combinar e descobrir novas cores.
            </p>

        </section>


        <section class="color-lab">

            <div class="palette">

                <button class="color" data-color="color-1">
                    <span class="hex">#6A0DAD</span>
                    <span class="copy">COPIAR</span>
                </button>

                <button class="color" data-color="color-2">
                    <span class="hex">#111111</span>
                    <span class="copy">COPIAR</span>
                </button>

                <button class="color" data-color="color-3">
                    <span class="hex">#F7F7F5</span>
                    <span class="copy">COPIAR</span>
                </button>

            </div>


            <button id="generate">
                GERAR NOVA PALETA
                <span>↗</span>
            </button>

            <p class="hint">
                Clique em uma cor para copiar seu código HEX.
            </p>

        </section>

    </main>


    <footer>

        <p>
            COLOR LAB / 2026
        </p>

        <p>
            Feito por Pedro Lucas Quintas Toledo
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
