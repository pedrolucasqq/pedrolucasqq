
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Páginas | Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Entre <span>Páginas.</span></h2>

        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="projeto.html">Catálogo</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="apresentacao">
            <p>FALE COM A GENTE</p>
            <h2>Vamos conversar?</h2>
            <p>
                Tem alguma dúvida, sugestão ou interesse em algum produto?
                Envie uma mensagem!
            </p>
        </section>

        <section class="formulario">
            <form>
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Seu e-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="assunto">Assunto</label>
                <select id="assunto" name="assunto">
                    <option>Dúvida</option>
                    <option>Interesse em produto</option>
                    <option>Sugestão</option>
                    <option>Outro</option>
                </select>

                <label for="mensagem">Sua mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <h2>Entre <span>Páginas.</span></h2>
        <p>Histórias que merecem uma segunda leitura.</p>
    </footer>

</body>
</html>
